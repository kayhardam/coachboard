name: CI

# Pull requests cover the fase branches; push covers what lands on main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# check-latest: a runner's cached Node 22 can be a patch behind the minimum
# Astro requires (22.23.4 from astro 7.4.2), so fetch the latest 22.x.
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run verify
      # Every commit in a pull request carries a noreply address. The checkout's
      # HEAD is GitHub's own merge commit, so check the PR's range. The logs are
      # public: name the commit and the role, never the address. Last in the job:
      # --unshallow gives this run the whole history, which a push run doesn't have.
      - name: Check commit addresses
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --quiet --no-tags --unshallow origin "$BASE_SHA" "$HEAD_SHA"
          git log --format='%H %ae %ce' "$BASE_SHA..$HEAD_SHA" > "$RUNNER_TEMP/commits"
          bad=0
          while read -r sha author committer; do
            case "$author" in
              *@users.noreply.github.com) ;;
              *) echo "::error::Commit $sha: the author's address is not a noreply address."; bad=1 ;;
            esac
            case "$committer" in
              *@users.noreply.github.com | noreply@github.com) ;;
              *) echo "::error::Commit $sha: the committer's address is not a noreply address."; bad=1 ;;
            esac
          done < "$RUNNER_TEMP/commits"
          exit "$bad"

  # The board flow in mobile Chromium and WebKit, against `wrangler dev`.
  # Two shards, each with its own build and server: about half the wall time.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
